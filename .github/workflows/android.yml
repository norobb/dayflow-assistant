name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    permissions:
      contents: write # publish the rolling ci-latest prerelease
    env:
      PUBLISH_CI: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DAYFLOW_KEYSTORE_BASE64 != '' }}
    name: Build Dayflow Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-debug-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # Signed release APK with the same key as the installed app, so it can update in place.
      # Published as the rolling "ci-latest" prerelease: README button + in-app CI channel.
      - name: Build signed CI APK
        if: env.PUBLISH_CI == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DAYFLOW_KEYSTORE_BASE64 }}
          DAYFLOW_KEYSTORE_PASSWORD: ${{ secrets.DAYFLOW_KEYSTORE_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_CI_RUN: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dayflow.keystore"
          DAYFLOW_KEYSTORE="$RUNNER_TEMP/dayflow.keystore" ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dayflow-ci.apk"
          rm "$RUNNER_TEMP/dayflow.keystore"

      - name: Publish ci-latest prerelease
        if: env.PUBLISH_CI == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(sed -n 's/^val baseVersionCode = //p' app/build.gradle.kts)
          CODE=$((BASE * 10000 + ${{ github.run_number }}))
          gh release delete ci-latest --yes --cleanup-tag || true
          printf 'Latest build from main (%s).\n\nversionCode: %s\n\n%s\n' \
            "${GITHUB_SHA::7}" "$CODE" "$(git log -1 --format=%s)" > "$RUNNER_TEMP/notes.md"
          gh release create ci-latest "$RUNNER_TEMP/dayflow-ci.apk" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Dayflow CI #${{ github.run_number }}" --notes-file "$RUNNER_TEMP/notes.md"
